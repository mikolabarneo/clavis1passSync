apiVersion: apps/v1
kind: Deployment
metadata:
  name: clavis1passsync
  labels:
    app: clavis1passsync
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clavis1passsync
  template:
    metadata:
      labels:
        app: clavis1passsync
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: clavis1passsync
          # Replace with your pushed image reference.
          image: registry.shore.ox.ac.uk/onepass/clavis1passsync:latest
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: FLASK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: clavis1passsync-secret
                  key: FLASK_SECRET_KEY
            # Requires the HTTPProxy's virtualhost.tls to be configured -
            # otherwise browsers will silently drop the session cookie.
            - name: SESSION_COOKIE_SECURE
              value: "true"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
