# Example only - do not apply as-is or commit a real secret to git.
#
# Generate a real key with: openssl rand -hex 32
# Then either apply a copy of this file with the value filled in, or create
# the secret imperatively so the value never touches a file on disk:
#   kubectl create secret generic clavis1passsync-secret \
#     --from-literal=FLASK_SECRET_KEY="$(openssl rand -hex 32)"
#
# Every replica must share the same key (see app.py) - a per-pod key would
# break sessions randomly depending on which pod handles a request.
apiVersion: v1
kind: Secret
metadata:
  name: clavis1passsync-secret
type: Opaque
stringData:
  FLASK_SECRET_KEY: "REPLACE_ME"
