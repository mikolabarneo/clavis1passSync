# Contour HTTPProxy - https://projectcontour.io/docs/main/config/fundamentals/
#
# TLS is not optional here: SESSION_COOKIE_SECURE=true (set in deployment.yaml)
# means browsers drop the session cookie - and with it the Clavis/1Password
# credentials in it - unless the connection is HTTPS. Point tls.secretName at
# a real TLS secret (cert-manager Certificate, or one you create yourself).
apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: clavis1passsync
spec:
  virtualhost:
    fqdn: one-pass-sync.shore.ox.ac.uk
    tls:
      secretName: clavis1passsync-tls
  routes:
    - conditions:
        - prefix: /
      services:
        - name: clavis1passsync
          port: 80
