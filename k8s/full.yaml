
---
# Step 1. Namespace creation.
apiVersion: v1
kind: Namespace
metadata:
  name: clavis1pass
  labels:
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/warn-version: latest
---
# Step 2. Secret creation.
# Example only - do not apply as-is or commit a real secret to git.
#
# Generate a real key with: openssl rand -hex 32
# Then either apply a copy of this file with the value filled in, or create
# the secret imperatively so the value never touches a file on disk:
#   kubectl create secret generic clavis1passsync-secret \
#     --from-literal=FLASK_SECRET_KEY="$(openssl rand -hex 32)"
#
# Every replica must share the same key (see app.py) - a per-pod key would
# break sessions randomly depending on which pod handles a request.
apiVersion: v1
kind: Secret
metadata:
  name: clavis1passsync-secret
  namespace: clavis1pass
type: Opaque
stringData:
  FLASK_SECRET_KEY: "REPLACE_ME"
---
# Step 3. Deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clavis1passsync
  namespace: clavis1pass
  labels:
    app: clavis1passsync
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clavis1passsync
  template:
    metadata:
      labels:
        app: clavis1passsync
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: clavis1passsync
          # Replace with your pushed image reference.
          image: registry.shore.ox.ac.uk/onepass/clavis1pass:latest
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: FLASK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: clavis1passsync-secret
                  key: FLASK_SECRET_KEY
            # Requires the HTTPProxy's virtualhost.tls to be configured -
            # otherwise browsers will silently drop the session cookie.
            - name: SESSION_COOKIE_SECURE
              value: "true"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
---
# Step 4. Service
apiVersion: v1
kind: Service
metadata:
  name: clavis1passsync
  namespace: clavis1pass
spec:
  selector:
    app: clavis1passsync
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Step 5. CNAME DNS record for the application.
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: clavis1pass-cname-record
  namespace: clavis1pass
spec:
  endpoints:
  - dnsName: clavis1pass.shore.ox.ac.uk
    recordType: CNAME
    targets:
    - infra-ingress.shore.ox.ac.uk
---
# Step 6. TLS cerificate for the website.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: clavis1pass-tls-cert
  namespace: clavis1pass
spec:
  commonName: clavis1pass.shore.ox.ac.uk
  dnsNames:
  - clavis1pass.shore.ox.ac.uk
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  secretName: clavis1pass-tls-cert-secret
---
# Step 7. HTTPProxy to expose the app service.
#
# No cert-manager/ingress-shim annotations here on purpose: the Certificate
# in Step 6 already manages clavis1pass-tls-cert-secret explicitly. Adding
# cert-manager.io/cluster-issuer (or tls-acme) here makes ingress-shim try to
# manage the same certificate/secret too, and the two controllers fighting
# over it is what produced the "object has been modified" retries and the
# HTTP-01 self-check 404s. HTTPProxy also has no use for the
# kubernetes.io/ingress.class or force-ssl-redirect Ingress annotations - TLS
# and its redirect are controlled by virtualhost.tls below.
kind: HTTPProxy
apiVersion: projectcontour.io/v1
metadata:
  name: clavis1pass-ingress
  namespace: clavis1pass
spec:
  virtualhost:
    fqdn: clavis1pass.shore.ox.ac.uk
    tls:
      secretName: clavis1pass-tls-cert-secret
  routes:
    - conditions:
      - prefix: /
      services:
      - name: clavis1passsync
        port: 80